server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    openfeign:
      client:
        config:
          event-service:
            connectTimeout: 2000
            readTimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
